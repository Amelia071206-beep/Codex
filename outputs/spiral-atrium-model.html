<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCF Spiral Atrium — 3D Preview</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0e1012}canvas{width:100%;height:100%;touch-action:none}</style><canvas id="c" aria-label="Interactive 3D LCF spiral atrium model"></canvas><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let yaw=.55,pitch=-.22,zoom=1,drag=false,last;
function fit(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',fit);fit();
function R(p){let [X,Y,Z]=p,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let a=X*cy-Y*sy,b=X*sy+Y*cy,d=Z*cp-b*sp,e=Z*sp+b*cp;let s=620*zoom/(15+e);return [innerWidth/2+a*s,innerHeight*.55-d*s,e]}
function poly(v,fill){let q=v.map(R);if(q.some(p=>p[2]<-13))return;q.sort((a,b)=>a[2]-b[2]);x.beginPath();q.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill()}
function box(cx,cy,z,w,d,h,col){let a=[[cx-w,cy-d,z],[cx+w,cy-d,z],[cx+w,cy+d,z],[cx-w,cy+d,z]],b=a.map(q=>[q[0],q[1],q[2]+h]);poly([...a],col);poly([a[0],a[1],b[1],b[0]],col);poly([a[1],a[2],b[2],b[1]],col);poly([...b],col)}
function arc(r,z,w,a0,a1,col){let n=46,vs=[];for(let i=0;i<=n;i++){let a=a0+(a1-a0)*i/n;vs.push([Math.cos(a)*r,Math.sin(a)*r,z],[Math.cos(a)*(r+w),Math.sin(a)*(r+w),z])}for(let i=0;i<n;i++)poly([vs[i*2],vs[i*2+1],vs[i*2+3],vs[i*2+2]],col)}
function draw(){x.fillStyle='#101316';x.fillRect(0,0,innerWidth,innerHeight);let grd=x.createLinearGradient(0,0,0,innerHeight);grd.addColorStop(0,'#2c363a');grd.addColorStop(1,'#101316');x.fillStyle=grd;x.fillRect(0,0,innerWidth,innerHeight);for(let z=0;z<=6.8;z+=3.4){arc(2,z,.25,0,Math.PI*2,'#6d6a61');arc(4.2,z+.98,.4,.1,6.05,'#6a6861')}for(let L=0;L<2;L++)for(let i=0;i<43;i++){let t=i/42,a=.25+5.55*t,r=3.6,z=L*3.4+.2+3.15*t;box(Math.cos(a)*r,Math.sin(a)*r,z,.55,.17,.09,i%2?'#c98a48':'#d69a58')}box(0,0,-.2,8,8,.2,'#4c504f');box(0,0,0,1.25,1.25,9.8,'#626159');for(let a=0;a<6.28;a+=.39){let r=7;box(Math.cos(a)*r,Math.sin(a)*r,0,.13,.36,10,'#50565a')}requestAnimationFrame(draw)}draw();
c.onpointerdown=e=>{drag=true;last=e;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-last.clientX)*.008;pitch=Math.max(-1.1,Math.min(.8,pitch+(e.clientY-last.clientY)*.006));last=e};c.onpointerup=()=>drag=false;c.onwheel=e=>{zoom=Math.max(.55,Math.min(1.7,zoom-e.deltaY*.001));e.preventDefault()};
</script></html>
